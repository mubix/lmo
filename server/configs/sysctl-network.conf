# Kernel tuning for high-concurrency egress testing server
# Every port on the internet gets scanned against this box — TCP tuning is
# load-bearing, not cosmetic.

# --- Accept queues ---
# The kernel's per-listener accept queue; if this is too small, incoming
# connections get dropped under bursty load even if the application can cope.
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# Backlog for packets queued on the NIC before the kernel processes them.
net.core.netdev_max_backlog = 16384

# --- Socket recycling ---
# Reuse TIME_WAIT sockets for new outbound connections (safe on modern kernels).
net.ipv4.tcp_tw_reuse = 1

# Shorter FIN-WAIT-2 so sockets free up faster under load.
net.ipv4.tcp_fin_timeout = 10

# --- Port range & orphan limits ---
# Widen ephemeral port range.
net.ipv4.ip_local_port_range = 1024 65535

# Allow more orphaned sockets before the kernel starts dropping.
net.ipv4.tcp_max_orphans = 262144

# --- conntrack ---
# iptables DNAT uses connection tracking; default table size is ~64K entries
# which gets exhausted instantly at internet scan rates. Raise it aggressively.
net.netfilter.nf_conntrack_max = 1048576
net.nf_conntrack_max = 1048576

# Shorter conntrack timeouts so closed connections drop out of the table faster.
net.netfilter.nf_conntrack_tcp_timeout_established = 600
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30

# --- Buffer sizes ---
# Default socket buffers for heavy connection churn.
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# --- SYN handling ---
# SYN cookies protect against SYN floods without dropping legitimate traffic.
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_synack_retries = 2
