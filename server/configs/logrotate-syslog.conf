# Aggressive logrotate for egress testing server
# sslh logs every connection to syslog — at internet scale this fills disk fast
/var/log/syslog
/var/log/mail.log
/var/log/kern.log
/var/log/auth.log
/var/log/user.log
/var/log/cron.log
{
    # Rotate when any log hits 100MB (don't wait for daily)
    size 100M

    # Keep 5 rotated copies max (~500MB total uncompressed)
    rotate 5

    # Delete anything older than 7 days
    maxage 7

    missingok
    notifempty

    # Compress immediately (no delaycompress — reclaim disk space now)
    compress

    # copytruncate avoids rsyslog "file in use" errors
    copytruncate

    sharedscripts
    postrotate
        /usr/lib/rsyslog/rsyslog-rotate
    endscript

    su root adm
}
